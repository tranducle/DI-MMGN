# Scientific Experiment Gates — pre-declared thresholds (Tier-1 #1)
# These MUST be committed BEFORE running the corresponding experiments, so the
# ablation/robustness result cannot be quietly re-interpreted after the fact.
# Paper ref: paper_outline §6.3 (ablation), §5.4 (RQ2 retention), §6.2 (drift).

gates:
  ORTHO_MECHANISM:           # paper §6.3 — is orthogonality load-bearing?
    metric: "F1_macro on LWDED-CMS eval"
    threshold: ">= 0.05 absolute F1 improvement vs no-orthogonality ablation"
    falsifies: "If delta < 0.05, the orthogonal decomposition is NOT load-bearing -> pivot / narrow C2"
    residual_max: 1.0e-3      # |d_legit . d_deface| must stay < this (hard mode)

  POST_REDESIGN_RETENTION:   # paper §5.4 / RQ2 — drift resilience
    metric: "F1_macro within 7 days after a legitimate CMS redesign"
    threshold: ">= 0.90 absolute, AND >= 0.10 above best static baseline's retention"
    falsifies: "If < 0.90, the drift-resilience claim fails -> narrow C3 to controlled-redesign only"

  UNSEEN_DOMAIN_GENERALIZATION:  # Blueprint R3
    metric: "F1_macro on held-out (never-seen) domains"
    threshold: ">= 0.85"
    falsifies: "If < 0.85, cross-domain generalization fails -> single-domain framing"

  BASELINE_SUPERIORITY:       # only if GraphSAGE/GAT baseline is run (Tier-1 #3)
    metric: "F1_macro vs strongest GNN baseline"
    threshold: "non-overlapping 95% CI (>=3 seeds)"
    falsifies: "If CIs overlap, no superiority claim -> report as competitive"

  RESULT_INTEGRITY:           # Tier-1 #4
    seeds: 3
    report: "mean +/- 95% CI for every headline number"
    falsifies: "Any headline stated without CI -> reject"
